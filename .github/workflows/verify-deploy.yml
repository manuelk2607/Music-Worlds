name: Verify and optionally deploy
# Manual releases; owner confirmed the separate deployment token and a $0 spending cap.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the existing music-worlds Worker after checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: music-worlds-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate && npm run build
      - name: Optional isolated database integration tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          CONFIRM_ISOLATED_TEST_DATABASE: '1'
        run: if [ -n "$TEST_DATABASE_URL" ]; then npm run test:integration; fi
      - name: Apply additive migrations to Music-Worlds only
        if: inputs.deploy
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate
      - name: Deploy existing Worker
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --env='' --var APP_COMMIT:${GITHUB_SHA}
      - name: Production smoke
        if: inputs.deploy
        run: npm run smoke
