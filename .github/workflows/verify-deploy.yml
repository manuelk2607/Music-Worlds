name: Verify and optionally deploy
# Manual releases; owner confirmed the separate deployment token and a $0 spending cap.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the existing music-worlds Worker after checks
        type: boolean
        default: false
      worlds_auth:
        description: Verify Worlds login and enable it on the existing Worker if deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: music-worlds-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate && npm run build
      - name: Optional isolated database integration tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          CONFIRM_ISOLATED_TEST_DATABASE: '1'
        run: if [ -n "$TEST_DATABASE_URL" ]; then npm run test:integration; fi
      - name: Verify Worlds login and profile continuity on the existing QA database
        if: inputs.worlds_auth
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npx --no-install tsx scripts/integration-worlds.ts
      - name: Apply additive migrations to Music-Worlds only
        if: inputs.deploy
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate
      - name: Deploy existing Worker
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          WORLDS_AUTH: ${{ inputs.worlds_auth }}
        run: |
          args=(--var "APP_COMMIT:${GITHUB_SHA}")
          if [ "$WORLDS_AUTH" = true ]; then
            args+=(
              --var HUB_AUTH_ENABLED:true
              --var HUB_OIDC_ISSUER:https://ep-bold-boat-batl101c.neonauth.c-8.eu-central-1.aws.neon.tech/worlds_identity/auth
              --var HUB_OIDC_CLIENT_ID:CxxmMJaWneXdwCQNckMcEOxWGvDnczVp
              --var HUB_OIDC_RESOURCE:https://music-worlds.maki26.workers.dev/api
            )
          fi
          npx wrangler deploy --env='' "${args[@]}"
      - name: Production smoke
        if: inputs.deploy
        env:
          EXPECT_WORLDS_AUTH: ${{ inputs.worlds_auth }}
        run: npm run smoke
